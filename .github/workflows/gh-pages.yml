# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the code
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          # This allows the action to push to gh-pages later
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. Install Jupyter Book dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter-book

      # 4. Build the book
      - name: Build the Jupyter Book site
        run: jupyter-book build mybook/  

      # 5. Deploy to GitHub Pages
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Where the built site lives
          publish_dir: mybook/_build/html
          # Name of the branch to push (GitHub Pages reads this by default)
          publish_branch: gh-pages
          
      - name: Disable Jekyll
        run: touch mybook/_build/html/.nojekyll
